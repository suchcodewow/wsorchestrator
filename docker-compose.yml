# Local development database — isolated from the prod Cloud SQL instance.
# Matches the default DATABASE_URL in frontend/.env.example.
#   docker compose up -d      # start
#   docker compose down       # stop (keeps data)
#   docker compose down -v     # stop and wipe data
#
# The project name is fixed so the container is workshoporchestrator-postgres-1
# whatever the clone's directory is called; the docs `docker exec` into it by
# that name.
name: workshoporchestrator
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshops"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A stand-in for the Cloud Storage bucket async recordings are kept in, for
  # developing against the bucket path (signed uploads, composing) without one.
  # Off unless asked for:
  #   docker compose --profile recordings up -d gcs
  # then in frontend/.env: RECORDINGS_BUCKET=recordings-dev and
  # STORAGE_EMULATOR_HOST=http://localhost:4443. Without them, recordings are
  # kept on local disk instead.
  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    profiles: ["recordings"]
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-cors-headers", "Content-Type,Range"]
    ports:
      - "4443:4443"

volumes:
  pgdata:
