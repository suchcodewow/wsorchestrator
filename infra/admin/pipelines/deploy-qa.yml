pipeline:
  name: Deploy QA
  identifier: deploy_qa
  projectIdentifier: orchestrator
  orgIdentifier: operations
  description: |
    Every merge to main lands here: verify, apply QA's infrastructure, build
    both images into QA's registry, migrate QA's database, and roll QA's Cloud
    Run. https://qa.harnessevents.io, GCP project harnessevents-qa.

    Nothing here can deploy to production. The IaCM workspace
    (qa_control_plane) authenticates as tf-admin-qa and the build steps as
    QA's build-sa, and neither holds a role outside the orchestrator-qa
    folder. Production is deploy_production, which promotes the image this
    pipeline built — so a commit reaches production only after it has run
    here. This pipeline can only *start* deploy_production, from its last
    stage, and only for a merge whose commit message carries the trailer
    `Release: production` and whose pull request was merged by someone in
    release_mergers.

    Stage order:
      1. Queue — one QA deploy at a time. Two merges in quick succession would
         otherwise apply OpenTofu against the same workspace and migrate the
         same database at once; the second now waits for the first.
      2. Verify — the same gate as the verify pipeline. Repeated because an
         admin can push to main without a PR.
      3. Infrastructure — IaCM against qa_control_plane. Note the workspace
         applies the HEAD of main, not necessarily this run's commit.
      4. Build and migrate — both images, then migrations before the new
         image goes live, as in production. On an empty database the
         migrations have nothing to alter, so the first run also bootstraps the
         schema with `drizzle-kit push`; that is the only place drizzle-kit
         ever runs unattended, and only against a database with no tables in
         it.
      5. Deploy — a Harness CD stage (service workshop_orchestrator,
         environment qa, infrastructure qa_cloud_run). It rolls the app with
         the native Cloud Run steps, points the runner jobs at the new image,
         and on failure routes traffic back to the revision that was serving.
         See "Cloud Run deploys" in DEPLOY.md.
      6. Release Production — only on a push-triggered run whose Deploy stage
         succeeded, and only when the commit carries `Release: production`.
         It looks up the pull request that produced the commit, ignores the
         trailer unless its merger is in release_mergers, checks QA answers,
         and then starts deploy_production for this exact commit through the
         Harness API, as the service account whose token is the secret
         deploy_production_trigger_token. It does not wait: deploy_production
         queues and runs on its own, and its preflight applies unchanged.
         See "Releasing from a merge" in docs/environments.md.

    Images come from mirror.gcr.io and gcr.io, never Docker Hub (rate limits on
    Harness Cloud's shared IPs).

    Stored INLINE in Harness and mirrored at infra/admin/pipelines/deploy-qa.yml.
    Update both.
  properties:
    ci:
      codebase:
        connectorRef: github_wsorchestrator
        build: <+input>
  variables:
    - name: verify
      type: String
      description: "\"false\" skips the verify stage."
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: run_infra
      type: String
      description: "\"false\" skips the infrastructure stage."
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: apply_infra
      type: String
      description: "\"false\" plans without applying."
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: deploy
      type: String
      description: "\"false\" builds and pushes only."
      required: false
      value: <+input>.default(true).allowedValues(true,false)
    - name: gcp_project
      type: String
      description: QA admin project.
      required: false
      value: harnessevents-qa
    - name: region
      type: String
      required: false
      value: us-central1
    - name: repo
      type: String
      description: QA's Artifact Registry path. deploy_production copies from here.
      required: false
      value: us-central1-docker.pkg.dev/harnessevents-qa/workshop-orchestrator
    - name: db_conn
      type: String
      required: false
      value: harnessevents-qa:us-central1:workshops-db
    - name: app_service
      type: String
      required: false
      value: workshop-orchestrator
    - name: runner_jobs
      type: String
      required: false
      value: tf-runner tf-reaper tf-scheduler
    # Not runtime inputs: a run cannot widen who may release from a merge.
    - name: release_mergers
      type: String
      description: "GitHub logins, space- or comma-separated, whose merges may release with the trailer \"Release: production\"."
      required: false
      value: suchcodewow
    - name: github_repo
      type: String
      required: false
      value: suchcodewow/wsorchestrator
    - name: qa_url
      type: String
      required: false
      value: https://qa.harnessevents.io
  stages:
    - stage:
        name: Queue
        identifier: queue
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Queue
                  name: One QA Deploy At A Time
                  identifier: queue
                  timeout: 2h
                  spec:
                    key: deploy_qa
                    scope: Pipeline
    - stage:
        name: Verify
        identifier: verify
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Typecheck and Test Runner
                  identifier: verify_runner
                  timeout: 10m
                  spec:
                    shell: Sh
                    image: mirror.gcr.io/library/node:22-slim
                    command: |
                      set -eu
                      cd runner
                      npm ci --no-audit --no-fund --silent
                      npm run verify
              - step:
                  type: Run
                  name: Typecheck Lint and Test Frontend
                  identifier: verify_frontend
                  timeout: 15m
                  spec:
                    shell: Sh
                    image: mirror.gcr.io/library/node:22-slim
                    command: |
                      set -eu
                      cd frontend
                      npm ci --no-audit --no-fund --silent
                      npm run verify
              # After the frontend's, whose node_modules resolve the two files
              # the studio shares with it.
              - step:
                  type: Run
                  name: Typecheck Studio
                  identifier: verify_studio
                  timeout: 10m
                  spec:
                    shell: Sh
                    image: mirror.gcr.io/library/node:22-slim
                    command: |
                      set -eu
                      cd scripts/explainer-video
                      npm ci --no-audit --no-fund --silent
                      npm run typecheck
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.verify> == "true"
    - stage:
        name: Infrastructure
        identifier: infra
        type: IACM
        spec:
          workspace: qa_control_plane
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 20m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 30m
                  spec:
                    command: plan
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 60m
                  spec:
                    command: apply
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.apply_infra> == "true" && (<+steps.plan.output.outputVariables['plannedChanges.added']> != "0" || <+steps.plan.output.outputVariables['plannedChanges.changed']> != "0" || <+steps.plan.output.outputVariables['plannedChanges.deleted']> != "0")
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.run_infra> == "true"
    - stage:
        name: Build and Migrate
        identifier: build_migrate
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: large
          execution:
            steps:
              - step:
                  type: Run
                  name: Resolve Build Info
                  identifier: resolve_build_info
                  spec:
                    shell: Sh
                    image: mirror.gcr.io/library/alpine:3.20
                    envVariables:
                      SHORT_SHA: <+codebase.shortCommitSha>
                    # Read from the clone, not <+codebase.commitMessage>: that is
                    # empty on manual runs and would be substituted into the
                    # script before the shell sees it. Base64 because buildArgs
                    # is comma-joined — see frontend/src/lib/build-info.ts.
                    # TAG is the image tag the deploy stage asks the service
                    # artifact for. RELEASE and RELEASE_INFRA are the commit's
                    # release trailers, read from the clone for the same
                    # reason; only the release_production stage acts on them,
                    # after it has checked who merged the pull request.
                    command: |
                      set -eu
                      apk add --no-cache git >/dev/null
                      git config --global --add safe.directory "$(pwd)"
                      export TAG="$SHORT_SHA"
                      echo "TAG=$TAG"
                      export FULL_SHA="$(git rev-parse HEAD)"
                      echo "FULL_SHA=$FULL_SHA"
                      export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      echo "BUILD_TIME=$BUILD_TIME"
                      SUBJECT="$(git log -1 --pretty=%s 2>/dev/null | cut -c1-120 || true)"
                      export BUILD_MESSAGE_B64="$(printf '%s' "$SUBJECT" | base64 | tr -d '\n')"
                      echo "BUILD_MESSAGE_B64=$BUILD_MESSAGE_B64"
                      # The last value of a trailer in the message's final
                      # paragraph; git matches the key case-insensitively.
                      trailer() {
                        git log -1 --format="%(trailers:key=$1,valueonly)" 2>/dev/null \
                          | sed '/^$/d' | tail -n 1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'
                      }
                      export RELEASE="$(trailer Release)"
                      [ -n "$RELEASE" ] || RELEASE=none
                      echo "RELEASE=$RELEASE"
                      export RELEASE_INFRA="$(trailer Release-Infra)"
                      [ -n "$RELEASE_INFRA" ] || RELEASE_INFRA=true
                      echo "RELEASE_INFRA=$RELEASE_INFRA"
                    outputVariables:
                      - name: TAG
                      - name: FULL_SHA
                      - name: BUILD_TIME
                      - name: BUILD_MESSAGE_B64
                      - name: RELEASE
                      - name: RELEASE_INFRA
              # The images share nothing, so they build side by side.
              - parallel:
                  - step:
                      type: BuildAndPushGAR
                      name: Build and Push App
                      identifier: build_push_app
                      spec:
                        connectorRef: gcp_qa_build_sa
                        host: us-central1-docker.pkg.dev
                        projectID: harnessevents-qa
                        imageName: workshop-orchestrator/app
                        tags:
                          - <+codebase.shortCommitSha>
                          - latest
                        dockerfile: frontend/Dockerfile
                        context: frontend
                        buildArgs:
                          BUILD_TAG: <+codebase.shortCommitSha>
                          BUILD_TIME: <+steps.resolve_build_info.output.outputVariables.BUILD_TIME>
                          BUILD_MESSAGE_B64: <+steps.resolve_build_info.output.outputVariables.BUILD_MESSAGE_B64>
                  - step:
                      type: BuildAndPushGAR
                      name: Build and Push Runner
                      identifier: build_push_runner
                      spec:
                        connectorRef: gcp_qa_build_sa
                        host: us-central1-docker.pkg.dev
                        projectID: harnessevents-qa
                        imageName: workshop-orchestrator/runner
                        tags:
                          - <+codebase.shortCommitSha>
                          - latest
                        dockerfile: runner/Dockerfile
                        context: runner
                  # Mimir Studio's job. Its Dockerfile takes two files from
                  # frontend/, so it builds from the repository root; the root
                  # .dockerignore keeps everything else out.
                  - step:
                      type: BuildAndPushGAR
                      name: Build and Push Studio
                      identifier: build_push_studio
                      spec:
                        connectorRef: gcp_qa_build_sa
                        host: us-central1-docker.pkg.dev
                        projectID: harnessevents-qa
                        imageName: workshop-orchestrator/studio
                        tags:
                          - <+codebase.shortCommitSha>
                          - latest
                        dockerfile: scripts/explainer-video/Dockerfile
                        context: .
              - step:
                  type: Run
                  name: Fetch Database URL
                  identifier: fetch_db_url
                  spec:
                    shell: Bash
                    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
                    envVariables:
                      GCP_KEY_B64: <+secrets.getValue("gcp_qa_build_sa_key_b64")>
                      GCP_PROJECT: <+pipeline.variables.gcp_project>
                    command: |
                      set -euo pipefail
                      umask 077
                      printf '%s' "$GCP_KEY_B64" | base64 -d > /tmp/sa.json
                      gcloud auth activate-service-account --key-file /tmp/sa.json --quiet
                      gcloud secrets versions access latest --secret=database-url \
                        --project "$GCP_PROJECT" > /harness/.db_url
                      rm -f /tmp/sa.json
                      echo "fetched database-url ($(wc -c < /harness/.db_url) bytes)"
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.deploy> == "true"
              - step:
                  type: Run
                  name: Migrate Database
                  identifier: migrate
                  spec:
                    shell: Bash
                    image: mirror.gcr.io/library/node:22-slim
                    envVariables:
                      GCP_KEY_B64: <+secrets.getValue("gcp_qa_build_sa_key_b64")>
                      DB_CONN: <+pipeline.variables.db_conn>
                    command: |
                      set -euo pipefail
                      umask 077
                      apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null

                      curl -sSL -o /usr/local/bin/cloud-sql-proxy \
                        https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
                      chmod +x /usr/local/bin/cloud-sql-proxy

                      printf '%s' "$GCP_KEY_B64" | base64 -d > /tmp/sa.json

                      DATABASE_URL_SOCKET="$(cat /harness/.db_url)"
                      CREDS="$(printf '%s' "$DATABASE_URL_SOCKET" | sed -E 's#^postgresql://([^@]+)@.*#\1#')"
                      DBNAME="$(printf '%s' "$DATABASE_URL_SOCKET" | sed -E 's#.*/([^/?]+)\?.*#\1#')"
                      export DATABASE_URL="postgresql://${CREDS}@127.0.0.1:5432/${DBNAME}"

                      cloud-sql-proxy --credentials-file /tmp/sa.json --port 5432 "$DB_CONN" &
                      for _ in $(seq 1 30); do
                        (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null && break
                        sleep 1
                      done

                      cd frontend
                      npm install pg --no-save --no-audit --no-fund --silent

                      # A database with no tables is a new QA environment: the
                      # .sql files only ALTER tables that already exist, so
                      # create them from schema.ts first. Never taken once the
                      # schema exists, so drizzle-kit cannot drop anything here.
                      EMPTY="$(node -e "
                        const pg = require('pg');
                        (async () => {
                          const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
                          await c.connect();
                          const r = await c.query(\"select count(*)::int as n from information_schema.tables where table_schema = 'public'\");
                          console.log(r.rows[0].n === 0 ? 'yes' : 'no');
                          await c.end();
                        })();
                      ")"
                      if [ "$EMPTY" = "yes" ]; then
                        echo "empty database: bootstrapping the schema from schema.ts"
                        npm ci --no-audit --no-fund --silent
                        npx drizzle-kit push --force
                      fi

                      node scripts/apply-sql.mjs

                      rm -f /tmp/sa.json /harness/.db_url
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.deploy> == "true"
    - stage:
        name: Deploy
        identifier: deploy
        description: |
          Rolls Cloud Run with Harness CD. Terraform (infra/admin/app.tf) owns the
          service's spec: env, secrets, the Cloud SQL volume, scaling, identity. So
          the Deploy step does not apply the service's placeholder manifest. Its
          preExecution exports the live service and the plugin replaces only the
          image. The export must carry DATABASE_URL, or the step fails before
          anything is replaced.
        type: Deployment
        spec:
          deploymentType: GoogleCloudRun
          service:
            serviceRef: workshop_orchestrator
            serviceInputs:
              serviceDefinition:
                type: GoogleCloudRun
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: app
                          type: GoogleArtifactRegistry
                          spec:
                            connectorRef: gcp_qa_build_sa
                            project: <+pipeline.variables.gcp_project>
                            version: <+pipeline.stages.build_migrate.spec.execution.steps.resolve_build_info.output.outputVariables.TAG>
          environment:
            environmentRef: qa
            deployToAll: false
            infrastructureDefinitions:
              - identifier: qa_cloud_run
          execution:
            steps:
              - stepGroup:
                  name: Cloud Run
                  identifier: cloud_run
                  # A pod on gcp-account-delegate's cluster. The Cloud Run steps
                  # are containers and need one; Harness Cloud cannot host them.
                  # Each step asks for 1 CPU: at the default 0.4 every gcloud
                  # call is 2.5x slower, and 2 CPU is no faster but waits for
                  # the cluster to find room.
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: account.Account_GCP_Connector
                      namespace: harness-delegate-ng
                  steps:
                    - step:
                        type: DownloadManifests
                        name: Download Manifests
                        identifier: download_manifests
                        timeout: 5m
                        spec: {}
                    - step:
                        type: GoogleCloudRunPrepareRollbackData
                        name: Record Serving Revision
                        identifier: prepare_rollback
                        timeout: 10m
                        spec:
                          connectorRef: account.harnessImage
                          image: harness/google-cloud-run-plugin:1.0.10-linux-amd64
                          imagePullPolicy: IfNotPresent
                          resources:
                            limits:
                              cpu: "1"
                              memory: 1Gi
                    - step:
                        type: GoogleCloudRunDeploy
                        name: Deploy App
                        identifier: deploy_app
                        timeout: 15m
                        spec:
                          connectorRef: account.harnessImage
                          image: harness/google-cloud-run-plugin:1.0.10-linux-amd64
                          imagePullPolicy: IfNotPresent
                          resources:
                            limits:
                              cpu: "1"
                              memory: 1Gi
                          # Runs in the plugin's shell before the plugin, so the
                          # manifest it exports here is the one the plugin applies
                          # (gcloud run services replace). No backslashes: Harness
                          # unescapes them before the shell sees this, so a sed
                          # backreference arrives as a control character.
                          preExecution: |
                            set -euo pipefail
                            umask 077
                            case "$PLUGIN_GCP_SERVICE_ACCOUNT_KEY" in
                              "{"*) printf '%s' "$PLUGIN_GCP_SERVICE_ACCOUNT_KEY" > /tmp/sa.json ;;
                              *) printf '%s' "$PLUGIN_GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/sa.json ;;
                            esac
                            gcloud auth activate-service-account --key-file /tmp/sa.json --quiet
                            rm -f /tmp/sa.json

                            SERVICE=<+pipeline.variables.app_service>
                            gcloud run services describe "$SERVICE" --project <+pipeline.variables.gcp_project> --region <+pipeline.variables.region> --format export > /tmp/live.yaml
                            refuse() { echo "::: REFUSED: $*" >&2; exit 1; }
                            grep -q 'name: DATABASE_URL' /tmp/live.yaml || refuse "the live $SERVICE has no DATABASE_URL"
                            [ "$(grep -c '^ *image: ' /tmp/live.yaml)" = 1 ] || refuse "expected one container image in the live $SERVICE"

                            # A rollback pins traffic to a named revision, and the
                            # export carries that pin. Replacing it as-is would give
                            # the new revision no traffic, so send 100% to latest.
                            [ "$(grep -c '^  traffic:' /tmp/live.yaml)" = 1 ] || refuse "expected one traffic block in the live $SERVICE"
                            awk '/^  traffic:/{ print; print "  - latestRevision: true"; print "    percent: 100"; skip=1; next } skip && (/^[^ ]/ || /^ [^ ]/ || /^  [^ -]/){ skip=0 } !skip{ print }' /tmp/live.yaml > /tmp/latest.yaml
                            [ "$(grep -c 'revisionName:' /tmp/latest.yaml)" = 0 ] || refuse "could not reset the traffic split"
                            [ "$(grep -c 'latestRevision: true' /tmp/latest.yaml)" = 1 ] || refuse "could not reset the traffic split"

                            IMAGE="$PLUGIN_CLOUD_RUN_SERVICE_CONTAINER_IMAGE_URL"
                            awk -v img="$IMAGE" '/^ *image: /{ sub(/image: .*/, "image: " img) } { print }' /tmp/latest.yaml > /tmp/next.yaml
                            grep -qF "image: $IMAGE" /tmp/next.yaml || refuse "could not set the image to $IMAGE"
                            [ "$(wc -l < /tmp/next.yaml)" = "$(wc -l < /tmp/latest.yaml)" ] || refuse "the image swap changed more than one line"
                            echo "deploying $IMAGE onto the live spec of $SERVICE"

                            if [ -n "${PLUGIN_CLOUD_RUN_SERVICE_MANIFEST_FILE_PATH:-}" ]; then
                              cp /tmp/next.yaml "$PLUGIN_CLOUD_RUN_SERVICE_MANIFEST_FILE_PATH"
                            fi
                            export PLUGIN_CLOUD_RUN_SERVICE_MANIFEST_FILE_CONTENT="$(cat /tmp/next.yaml)"
                    - step:
                        type: Run
                        name: Update Runner Jobs
                        identifier: update_runner_jobs
                        timeout: 10m
                        # Not GoogleCloudRunJob: that step executes the job after
                        # replacing it, and these jobs must only run when the app
                        # or Cloud Scheduler starts them.
                        spec:
                          connectorRef: account.harnessImage
                          image: harness/google-cloud-run-plugin:1.0.10-linux-amd64
                          imagePullPolicy: IfNotPresent
                          resources:
                            limits:
                              cpu: "1"
                              memory: 1Gi
                          shell: Bash
                          envVariables:
                            GCP_KEY_B64: <+secrets.getValue("gcp_qa_build_sa_key_b64")>
                            GCP_PROJECT: <+pipeline.variables.gcp_project>
                            REGION: <+pipeline.variables.region>
                            REPO: <+pipeline.variables.repo>
                            RUNNER_JOBS: <+pipeline.variables.runner_jobs>
                            TAG: <+pipeline.stages.build_migrate.spec.execution.steps.resolve_build_info.output.outputVariables.TAG>
                          command: |
                            set -euo pipefail
                            umask 077
                            printf '%s' "$GCP_KEY_B64" | base64 -d > /tmp/sa.json
                            gcloud auth activate-service-account --key-file /tmp/sa.json --quiet
                            rm -f /tmp/sa.json

                            for job in $RUNNER_JOBS; do
                              gcloud run jobs update "$job" \
                                --project "$GCP_PROJECT" --region "$REGION" \
                                --image "$REPO/runner:$TAG"
                            done

                            # mimir-studio exists only where both of its keys
                            # are set (studio.tf), so a missing job is skipped.
                            if gcloud run jobs describe mimir-studio \
                                --project "$GCP_PROJECT" --region "$REGION" >/dev/null 2>&1; then
                              gcloud run jobs update mimir-studio \
                                --project "$GCP_PROJECT" --region "$REGION" \
                                --image "$REPO/studio:$TAG"
                            fi
            rollbackSteps:
              - stepGroup:
                  name: Cloud Run Rollback
                  identifier: cloud_run_rollback
                  stepGroupInfra:
                    type: KubernetesDirect
                    spec:
                      connectorRef: account.Account_GCP_Connector
                      namespace: harness-delegate-ng
                  steps:
                    - step:
                        type: GoogleCloudRunRollback
                        name: Route Traffic Back
                        identifier: rollback
                        timeout: 10m
                        spec:
                          connectorRef: account.harnessImage
                          image: harness/google-cloud-run-plugin:1.0.10-linux-amd64
                          imagePullPolicy: IfNotPresent
                          resources:
                            limits:
                              cpu: "1"
                              memory: 1Gi
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.deploy> == "true"
    - stage:
        name: Release Production
        identifier: release_production
        description: |
          Starts deploy_production for this commit when its message carries
          the trailer `Release: production` and its pull request was merged by
          someone in release_mergers. Push-triggered runs only, so neither a
          manual run nor a re-run of an old commit releases. A trailer from
          anyone else, or on a commit pushed without a pull request, is logged
          and ignored, and the stage succeeds. A failure here (GitHub or QA not
          answering, a bad Release-Infra) fails the run: QA is deployed, and
          production has not been started.
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Check Merger and QA
                  identifier: check
                  timeout: 10m
                  spec:
                    shell: Sh
                    image: mirror.gcr.io/library/alpine:3.20
                    envVariables:
                      SHA: <+pipeline.stages.build_migrate.spec.execution.steps.resolve_build_info.output.outputVariables.FULL_SHA>
                      RELEASE_INFRA: <+pipeline.stages.build_migrate.spec.execution.steps.resolve_build_info.output.outputVariables.RELEASE_INFRA>
                      RELEASERS: <+pipeline.variables.release_mergers>
                      GITHUB_REPO: <+pipeline.variables.github_repo>
                      GITHUB_TOKEN: <+secrets.getValue("github_pat_wsorchestrator")>
                      QA_URL: <+pipeline.variables.qa_url>
                    command: |
                      set -euo pipefail
                      apk add --no-cache curl jq >/dev/null
                      fail() { echo "::: REFUSED: $*" >&2; exit 1; }
                      gh_api() {
                        curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
                          -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPO/$1"
                      }
                      lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
                      allowed() {
                        [ -n "$1" ] || return 1
                        for r in $(printf '%s' "$RELEASERS" | tr ',' ' '); do
                          [ "$(lower "$r")" = "$(lower "$1")" ] && return 0
                        done
                        return 1
                      }

                      case "$RELEASE_INFRA" in
                        true|false) ;;
                        *) fail "Release-Infra must be true or false, not \"$RELEASE_INFRA\"" ;;
                      esac

                      HONOURED=no
                      PR=none
                      MERGED_BY=none
                      gh_api "commits/$SHA/pulls" > /tmp/pulls.json || fail "GitHub did not say which pull request produced $SHA"
                      FOUND="$(jq -r --arg sha "$SHA" '[.[] | select(.merge_commit_sha == $sha and .base.ref == "main")][0].number // empty' /tmp/pulls.json)"
                      if [ -z "$FOUND" ]; then
                        echo "::: Release trailer ignored: $SHA is not the merge of a pull request into main"
                      else
                        PR="$FOUND"
                        # merged_by is only on the single-PR endpoint; the list
                        # above returns it as null.
                        gh_api "pulls/$PR" > /tmp/pr.json || fail "GitHub did not return pull request #$PR"
                        MERGED_BY="$(jq -r --arg sha "$SHA" 'if .merged and .merge_commit_sha == $sha then .merged_by.login // "" else "" end' /tmp/pr.json)"
                        if allowed "$MERGED_BY"; then
                          HONOURED=yes
                          echo "#$PR was merged by $MERGED_BY, who is in release_mergers"
                        else
                          echo "::: Release trailer ignored: #$PR was merged by ${MERGED_BY:-nobody}, who is not in release_mergers ($RELEASERS)"
                          [ -n "$MERGED_BY" ] || MERGED_BY=none
                        fi
                      fi

                      if [ "$HONOURED" = yes ]; then
                        # /signin renders the root layout, which reads the
                        # database, so a 200 means the new revision serves.
                        CODE=000
                        for _ in $(seq 1 12); do
                          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$QA_URL/signin" || true)"
                          [ "$CODE" = 200 ] && break
                          sleep 10
                        done
                        [ "$CODE" = 200 ] || fail "$QA_URL/signin answered $CODE, so production was not started"
                        echo "QA answers 200 at $QA_URL/signin"
                      fi
                      export HONOURED PR MERGED_BY
                    outputVariables:
                      - name: HONOURED
                      - name: PR
                      - name: MERGED_BY
              - step:
                  type: Run
                  name: Start deploy_production
                  identifier: start_production
                  timeout: 5m
                  spec:
                    shell: Sh
                    image: mirror.gcr.io/library/alpine:3.20
                    envVariables:
                      SHA: <+pipeline.stages.build_migrate.spec.execution.steps.resolve_build_info.output.outputVariables.FULL_SHA>
                      RUN_INFRA: <+pipeline.stages.build_migrate.spec.execution.steps.resolve_build_info.output.outputVariables.RELEASE_INFRA>
                      PR: <+steps.check.output.outputVariables.PR>
                      MERGED_BY: <+steps.check.output.outputVariables.MERGED_BY>
                      HARNESS_TOKEN: <+secrets.getValue("deploy_production_trigger_token")>
                      ACCOUNT: <+account.identifier>
                      ORG: <+org.identifier>
                      PROJECT: <+project.identifier>
                      QA_RUN: <+pipeline.executionUrl>
                    # The service account behind HARNESS_TOKEN can execute
                    # deploy_production and nothing else. The owner's PAT
                    # (tf_harness_api_key) must never be used here.
                    command: |
                      set -euo pipefail
                      apk add --no-cache curl jq >/dev/null
                      cat > /tmp/inputs.yaml <<INPUTS
                      pipeline:
                        identifier: deploy_production
                        variables:
                          - name: sha
                            type: String
                            value: "$SHA"
                          - name: run_infra
                            type: String
                            value: "$RUN_INFRA"
                          - name: apply_infra
                            type: String
                            value: "true"
                          - name: allow_rollback
                            type: String
                            value: "false"
                      INPUTS
                      cat /tmp/inputs.yaml
                      NOTES="$(printf 'Release: production from #%s, merged by %s. deploy_qa run: %s' "$PR" "$MERGED_BY" "$QA_RUN" | jq -sRr @uri)"
                      BASE="https://app.harness.io/gateway/pipeline/api/pipeline/execute/deploy_production"
                      curl -fsS -X POST -H "x-api-key: $HARNESS_TOKEN" -H 'Content-Type: application/yaml' \
                        --data-binary @/tmp/inputs.yaml \
                        "$BASE?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJECT&notesForPipelineExecution=$NOTES" \
                        > /tmp/started.json || { cat /tmp/started.json >&2 || true; echo "::: deploy_production was not started" >&2; exit 1; }
                      RUN_ID="$(jq -r '.data.planExecution.uuid // empty' /tmp/started.json)"
                      [ -n "$RUN_ID" ] || { cat /tmp/started.json >&2; echo "::: no execution id in Harness's answer" >&2; exit 1; }
                      echo "started deploy_production for $SHA (run_infra=$RUN_INFRA):"
                      echo "https://app.harness.io/ng/account/$ACCOUNT/all/orgs/$ORG/projects/$PROJECT/pipelines/deploy_production/executions/$RUN_ID/pipeline"
                  when:
                    stageStatus: Success
                    condition: <+steps.check.output.outputVariables.HONOURED> == "yes"
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.deploy> == "true" && <+pipeline.triggerType> == "WEBHOOK" && <+pipeline.stages.deploy.status> == "SUCCEEDED" && <+pipeline.stages.build_migrate.spec.execution.steps.resolve_build_info.output.outputVariables.RELEASE> == "production"
